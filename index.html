<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Tarefas | Google Calendar Pro</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-layout">
        <!-- Barra Lateral com Mini Calendário -->
        <aside class="sidebar">
            <div class="mini-calendar">
                <div class="calendar-header">
                    <button type="button" id="prev-month" aria-label="Mês anterior"><i class="fa-solid fa-chevron-left"></i></button>
                    <h3 id="month-year-display">Mês Ano</h3>
                    <button type="button" id="next-month" aria-label="Próximo mês"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="weekdays-grid">
                    <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                </div>
                <div class="days-grid" id="calendar-days">
                    <!-- Gerado via JS -->
                </div>
            </div>
            <button type="button" id="clear-date-filter" class="secondary-btn" style="display: none;">
                <i class="fa-solid fa-filter-circle-xmark"></i> Ver Todas as Datas
            </button>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-container">
            <header class="app-header">
                <div class="logo-area">
                    <i class="fa-solid fa-calendar-days calendar-icon"></i>
                    <h1>Minha Agenda</h1>
                </div>
                <div class="header-actions">
                    <!-- Dropdown do Sininho (Centro de Notificações / Tarefas Pendentes) -->
                    <div class="notification-wrapper">
                        <button type="button" id="notification-toggle" title="Ver Tarefas Pendentes" aria-label="Ver tarefas pendentes" aria-expanded="false">
                            <i class="fa-solid fa-bell"></i>
                            <span id="notification-badge" class="badge" style="display: none;" aria-live="polite">0</span>
                        </button>
                        <div id="notification-dropdown" class="notification-dropdown" style="display: none;">
                            <div class="dropdown-header">
                                <h4>Tarefas Pendentes</h4>
                            </div>
                            <div id="dropdown-list" class="dropdown-list">
                                <!-- Preenchido via JS -->
                            </div>
                        </div>
                    </div>

                    <button type="button" id="theme-toggle" title="Alternar Dark Mode" aria-label="Alternar tema" aria-pressed="false">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            </header>

            <div class="main-content">
                <!-- Formulário -->
                <section class="form-section">
                    <form id="todo-form">
                        <input type="hidden" id="todo-id">
                        <div class="input-group">
                            <input type="text" id="todo-input" placeholder="Título do evento ou tarefa..." required autocomplete="off">
                        </div>
                        <div class="datetime-group">
                            <div class="field">
                                <label><i class="fa-regular fa-calendar"></i> Data</label>
                                <input type="date" id="todo-date" required>
                            </div>
                            <div class="field">
                                <label><i class="fa-regular fa-clock"></i> Horário</label>
                                <input type="time" id="todo-time" required>
                            </div>
                            <div class="field">
                                <label><i class="fa-solid fa-flag"></i> Prioridade</label>
                                <select id="todo-priority">
                                    <option value="low">Baixa</option>
                                    <option value="medium" selected>Média</option>
                                    <option value="high">Alta</option>
                                </select>
                            </div>
                            <div class="field">
                                <label><i class="fa-solid fa-tag"></i> Categoria</label>
                                <select id="todo-category">
                                    <option value="Trabalho">Trabalho</option>
                                    <option value="Estudos">Estudos</option>
                                    <option value="Pessoal" selected>Pessoal</option>
                                    <option value="Outros">Outros</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" id="btn-submit">
                            <i class="fa-solid fa-plus"></i> Adicionar Evento
                        </button>
                    </form>
                </section>

                <!-- Painel de Progresso e Estatísticas -->
                <section class="dashboard-section">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-title">Total</span>
                            <span class="stat-value" id="stat-total">0</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-title">Concluídas</span>
                            <span class="stat-value" id="stat-completed">0</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-title">Pendentes</span>
                            <span class="stat-value" id="stat-pending">0</span>
                        </div>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
                    </div>
                    <span class="progress-text" id="progress-text">0% Concluído</span>
                </section>

                <!-- Listagem e Filtros -->
                <section class="tasks-section">
                    <div class="search-bar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Pesquisar compromissos..." autocomplete="off">
                    </div>

                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">Todas</button>
                        <button class="filter-btn" data-filter="pending">Pendentes</button>
                        <button class="filter-btn" data-filter="completed">Concluídas</button>
                    </div>

                    <div class="date-filter-bar">
                        <span id="current-date-display">Exibindo todas as tarefas</span>
                    </div>

                    <ul id="todo-list">
                        <!-- Preenchido via JavaScript -->
                    </ul>
                </section>
            </div>
        </main>
    </div>

    <script src="/src/js/script.js"></script>
</body>
</html>
